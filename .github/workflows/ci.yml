name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run when a newer commit is pushed to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format and type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Expo types (expo-env.d.ts)
        run: npx expo customize tsconfig.json

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck
